<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Tropical</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo-box">
        <div class="logo-circle">C</div>
        <h1>Catálogo Digital</h1>
    </div>

    <div class="search-wrapper">
        <label for="search"></label><input type="text" id="search" placeholder="Buscar produtos...">
    </div>

    <div class="loc-box">Porto Velho, RO</div>
</header>

<section class="section-aviso">
    <div class="container-aviso">
        <h2 class="header-texto-aviso">Produtos de Qualidade Todo Dia</h2>
        <p class="texto-small-aviso"> Entregamos na sua casa em Porto Velho! </p>
    </div>
</section>

<section class="produtos-header">
    <h2 class="titulo-secao">Nossos Produtos</h2>
    <span class="produtos-contador" id="contador-Produtos">Carregando</span>
</section>

<main class="container" id="produtos-container">
    </main>

<script type="module" src="script.js"></script>
</body>
</html>
